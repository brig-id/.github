name: Security Audit

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing the Cargo workspace
        type: string
        default: "."

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: cargo-audit / cargo-deny
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-08-05
        with:
          toolchain: stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-audit

      - name: Install cargo-deny
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-deny

      - name: cargo audit (the lock file: vulnerabilities, unsound and yanked crates)
        # Everything Cargo.lock names, compiled or not. An unmaintained crate
        # is shown here and not refused: the lock file also names optional
        # dependencies that nothing turns on, and a crate nobody compiles is
        # nobody's risk. Whether one is compiled is the next step's to say.
        run: cargo audit --deny unsound --deny yanked

      - name: cargo deny check (what is compiled: advisories, licences, sources)
        # deny.toml of the repository: `unmaintained = "all"` refuses an
        # unmaintained crate anywhere in what is built, and its `ignore`
        # list is the one place an exception is argued.
        run: cargo deny check
