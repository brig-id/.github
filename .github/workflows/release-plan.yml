name: Release plan

# The first job of a server's Release workflow: the version this release
# would be and its notes, from what was merged since the last release in the
# server, crypto, the core and the interface. It publishes nothing.
#
# `brigid release plan` (brig-id/cli) does the reading, so that what
# `brigid release` announces from a workspace is what a release does.

on:
  workflow_call:
    inputs:
      bump:
        description: auto (read from the commits), patch, minor or major.
        type: string
        default: auto
      force:
        description: Release even when nothing changed for the people who run the server.
        type: boolean
        default: false
      cli-branch:
        description: The branch of brig-id/cli to plan with.
        type: string
        default: main
    outputs:
      needed:
        description: "'true' when there is a release to make."
        value: ${{ jobs.plan.outputs.needed }}
      version:
        description: The version of the release, without the `v`.
        value: ${{ jobs.plan.outputs.version }}
      tag:
        description: The tag of the release, `vX.Y.Z`.
        value: ${{ jobs.plan.outputs.tag }}
      previous:
        description: The tag of the release before, when there is one.
        value: ${{ jobs.plan.outputs.previous }}

permissions:
  contents: read

jobs:
  plan:
    name: Version and notes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      needed: ${{ steps.plan.outputs.needed }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      previous: ${{ steps.plan.outputs.previous }}
    steps:
      - name: The commit passed its checks
        # A release is made of a commit of main whose own runs are over and
        # green: this one builds and tests it again, the others (the suites
        # with the other repositories) are not repeated here.
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100" \
            --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID) | select(.event == \"push\") | \"\(.status) \(.conclusion) \(.name) \(.html_url)\"")
          echo "$runs"
          if grep -vE '^completed (success|skipped|neutral) ' <<< "$runs" | grep -q .; then
            echo "::error::main is not green at $GITHUB_SHA (or its runs are not over): see the runs listed above."
            exit 1
          fi

      - name: Install the brigid command
        env:
          CLI_BRANCH: ${{ inputs.cli-branch }}
        run: cargo install --locked --git "https://github.com/$GITHUB_REPOSITORY_OWNER/cli" --branch "$CLI_BRANCH" brigid

      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump || 'auto' }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          args=(--bump "$BUMP" --at "$GITHUB_SHA" --notes notes.md)
          if [ "$FORCE" = true ]; then args+=(--force); fi
          # It writes needed, version, tag and previous to $GITHUB_OUTPUT,
          # and prints them.
          plan=$(brigid release plan "${GITHUB_REPOSITORY#*/}" "${args[@]}")
          echo "$plan"
          value() { sed -n "s/^$1=//p" <<< "$plan"; }
          {
            if [ "$(value needed)" = true ]; then
              echo "## ${GITHUB_REPOSITORY#*/} $(value tag)"
            else
              echo "## No release: nothing changed for the people who run it since $(value previous)"
              echo
              echo "Run the workflow again with **force** to release anyway."
            fi
            echo
            cat notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: notes.md
          if-no-files-found: error
