name: Conventional Commits — commit messages check

# Reusable template. Product repos can call this or embed the steps directly.
on:
  workflow_call:

jobs:
  check-commits:
    name: Commit messages follow conventional commits + gitmoji
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: helpers4/action-conventional-commits@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
